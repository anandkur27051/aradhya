<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>JARVIS</title>
<style>
:root{
  --bg0:#04070d; --bg1:#0a1420; --glass:rgba(18,30,46,.55); --glass-brd:rgba(0,229,255,.18);
  --cyan:#00e5ff; --green:#00ff87; --amber:#ffb300; --red:#ff3d71; --ink:#eaf6ff; --dim:#7c93a8;
  --accent:var(--cyan);
  --f-ui:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"SF Mono","Consolas","Roboto Mono",ui-monospace,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--f-ui); color:var(--ink); overflow:hidden; position:fixed; inset:0;
  background:
    radial-gradient(1200px 800px at 50% -10%, #0e2233 0%, transparent 60%),
    radial-gradient(900px 700px at 100% 110%, #071a1f 0%, transparent 55%),
    linear-gradient(160deg,var(--bg1),var(--bg0));
}
#fx{position:fixed;inset:0;z-index:0;opacity:.25;pointer-events:none}
.app{position:relative;z-index:1;display:flex;flex-direction:column;height:100dvh;padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 12px);gap:12px;opacity:0;transition:opacity .7s ease}

/* top bar */
.topbar{display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:10px}
.brand .mark{width:34px;height:34px;border-radius:50%;border:2px solid var(--accent);
  box-shadow:0 0 18px rgba(0,229,255,.4) inset,0 0 14px rgba(0,229,255,.25);
  display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--accent)}
.brand h1{font-size:16px;letter-spacing:5px;font-weight:700}
.brand small{display:block;font-size:8px;letter-spacing:3px;color:var(--dim);margin-top:1px}
.statuspill{font-family:var(--f-mono);font-size:10px;letter-spacing:2px;color:#02141a;background:var(--accent);
  padding:6px 12px;border-radius:100px;font-weight:700;box-shadow:0 0 16px rgba(0,229,255,.35)}
.gear{width:38px;height:38px;border-radius:12px;background:var(--glass);border:1px solid var(--glass-brd);
  display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--dim)}
.gear:active{transform:scale(.94)}

/* live stats */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:10px 8px;text-align:center}
.stat .k{font-size:8px;letter-spacing:1.5px;color:var(--dim);font-weight:700}
.stat .v{font-family:var(--f-mono);font-size:14px;font-weight:700;margin-top:3px;color:var(--ink)}

/* core */
.core{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
.reactor{width:min(58vw,230px);aspect-ratio:1;position:relative;display:flex;align-items:center;justify-content:center}
.ring{position:absolute;border-radius:50%;border:2px solid var(--accent);opacity:.55}
.ring.a{inset:0;border-style:dashed;animation:spin 22s linear infinite}
.ring.b{inset:12%;border-width:1px;opacity:.35;animation:spin 14s linear infinite reverse}
.ring.c{inset:26%;border-top-color:transparent;border-left-color:transparent;animation:spin 6s linear infinite}
.orb{width:38%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle at 50% 40%,var(--accent),transparent 70%);
  box-shadow:0 0 60px var(--accent);transition:all .4s ease}
.state-listening .orb{--accent:var(--green)} .state-listening{--accent:var(--green)}
.state-thinking .orb{--accent:var(--amber)} .state-thinking{--accent:var(--amber)}
.state-speaking .orb{--accent:var(--red)} .state-speaking{--accent:var(--red)}
.corelabel{font-family:var(--f-mono);letter-spacing:6px;font-size:13px;font-weight:700;color:var(--accent)}
.subhint{font-size:10px;color:var(--dim);letter-spacing:1px;margin-top:-8px}

/* dock */
.dock{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{background:var(--glass);border:1px solid var(--glass-brd);border-radius:16px;padding:12px 4px;text-align:center;
  font-size:10px;font-weight:600;color:var(--ink);letter-spacing:.5px}
.chip .i{font-size:18px;display:block;margin-bottom:4px}
.chip:active{transform:scale(.95);border-color:var(--accent)}
.chip.on{background:rgba(0,229,255,.16);border-color:var(--accent);color:var(--accent)}

/* chat */
.chat{background:var(--glass);border:1px solid var(--glass-brd);border-radius:20px;display:flex;flex-direction:column;overflow:hidden;height:170px}
#flow{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
#flow::-webkit-scrollbar{display:none}
.msg{max-width:85%;padding:9px 12px;border-radius:14px;font-size:13px;line-height:1.45;animation:rise .25s ease}
.msg.j{align-self:flex-start;background:rgba(0,229,255,.10);border:1px solid rgba(0,229,255,.18)}
.msg.u{align-self:flex-end;background:rgba(0,255,135,.12);border:1px solid rgba(0,255,135,.2)}
.msg .who{font-size:8px;letter-spacing:2px;color:var(--dim);margin-bottom:2px}
.inbar{display:flex;gap:8px;padding:8px;border-top:1px solid var(--glass-brd)}
#inp{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--glass-brd);border-radius:100px;color:var(--ink);
  padding:11px 16px;font-size:14px;font-family:var(--f-ui);outline:none}
#inp::placeholder{color:var(--dim)}
.send{background:var(--accent);color:#02141a;border:none;border-radius:100px;padding:0 20px;font-weight:800;font-size:12px;letter-spacing:1px}
.send:active{transform:scale(.95)}

/* boot */
#boot{position:fixed;inset:0;z-index:50;background:var(--bg0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;transition:opacity .6s}
#boot .r{width:96px;height:96px;border-radius:50%;border:3px solid var(--cyan);border-top-color:transparent;animation:spin 1s linear infinite;box-shadow:0 0 40px rgba(0,229,255,.4)}
#boot .t{font-family:var(--f-mono);letter-spacing:4px;color:var(--cyan);font-size:12px}

/* modals */
.modal{position:fixed;inset:0;z-index:60;background:rgba(4,7,13,.9);backdrop-filter:blur(14px);display:none;flex-direction:column;padding:calc(env(safe-area-inset-top) + 24px) 20px 24px}
.modal h2{text-align:center;letter-spacing:4px;font-size:16px;margin-bottom:18px;color:var(--cyan)}
.modal input,.modal select{width:100%;background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;color:var(--ink);padding:14px;margin-bottom:14px;font-size:14px;font-family:var(--f-ui)}
.modal .scroll{flex:1;overflow-y:auto}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--glass-brd);border-radius:14px;padding:12px;margin-bottom:8px;flex-wrap:wrap}
.row .nm{font-size:14px;font-weight:600} .row .nb{font-size:11px;color:var(--dim);font-family:var(--f-mono)}
.mini{border:none;border-radius:100px;padding:8px 12px;font-size:10px;font-weight:700;letter-spacing:.5px}
.mini.wa{background:#25D366;color:#022} .mini.call{background:#34B7F1;color:#022} .mini.msg{background:var(--amber);color:#221a00} .mini.del{background:var(--red);color:#fff}
.close{background:var(--accent);color:#02141a;border:none;border-radius:14px;padding:15px;font-weight:800;letter-spacing:1px;margin-top:10px}

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{transform:scale(.94);opacity:.85}50%{transform:scale(1.06);opacity:1}}
.state-listening .orb,.state-speaking .orb,.state-thinking .orb{animation:pulse 1.1s ease-in-out infinite}
</style>
</head>
<body>
<canvas id="fx"></canvas>

<div id="boot"><div class="r"></div><div class="t" id="boot-t">INITIALISING CORE</div></div>
<!--CHUNK2-->
<div class="app" id="app">
  <div class="topbar">
    <div class="brand">
      <div class="mark">J</div>
      <div><h1>JARVIS</h1><small id="mode-sub">PERSONAL AI</small></div>
    </div>
    <div class="statuspill" id="pill">STANDBY</div>
    <div class="gear" onclick="openModal('cfg')">⚙</div>
  </div>

  <div class="stats">
    <div class="stat"><div class="k">BATTERY</div><div class="v" id="s-bat">--</div></div>
    <div class="stat"><div class="k">RAM FREE</div><div class="v" id="s-ram">--</div></div>
    <div class="stat"><div class="k">NETWORK</div><div class="v" id="s-net">--</div></div>
    <div class="stat"><div class="k">CORE</div><div class="v" id="s-core">--</div></div>
  </div>

  <div class="core" id="core">
    <div class="reactor">
      <div class="ring a"></div><div class="ring b"></div><div class="ring c"></div>
      <div class="orb"></div>
    </div>
    <div class="corelabel" id="corelabel">READY</div>
    <div class="subhint" id="subhint">Say “Jarvis” once — phir command bolte raho</div>
  </div>

  <div class="dock">
    <div class="chip" id="mic-chip" onclick="toggleMic()"><span class="i">🎙️</span>MIC</div>
    <div class="chip" onclick="handleUserInput('torch on')"><span class="i">🔦</span>TORCH</div>
    <div class="chip" onclick="showApps()"><span class="i">🧩</span>APPS</div>
    <div class="chip" onclick="showContacts()"><span class="i">👥</span>CONTACTS</div>
    <div class="chip" onclick="handleUserInput('screenshot')"><span class="i">📸</span>SNAP</div>
    <div class="chip" onclick="handleUserInput('weather')"><span class="i">🌦️</span>WEATHER</div>
    <div class="chip" onclick="handleUserInput('home')"><span class="i">🏠</span>HOME</div>
    <div class="chip" onclick="showFavs()"><span class="i">⭐</span>FAVS</div>
  </div>

  <div class="chat">
    <div id="flow"></div>
    <div class="inbar">
      <input id="inp" placeholder="Hukm kijiye, Sir…" autocomplete="off">
      <button class="send" onclick="manualSend()">➤</button>
    </div>
  </div>
</div>

<div id="cfg" class="modal">
  <h2>CORE UPLINK</h2>
  <div class="scroll">
    <input type="password" id="key" placeholder="Groq / OpenAI API key…">
    <input type="text" id="model" placeholder="Model (default: llama-3.3-70b-versatile)">

    <div style="color:var(--cyan);font-size:11px;letter-spacing:2px;margin:10px 2px 8px">🎙 HUMAN VOICE (Azure)</div>
    <input type="password" id="nvkey" placeholder="Azure Speech key (free 500k/month)…">
    <input type="text" id="nvregion" placeholder="Region (default: centralindia)">
    <select id="nvvoice">
      <option value="hi-IN-SwaraNeural">Hindi — Swara (female, warm)</option>
      <option value="hi-IN-AnanyaNeural">Hindi — Ananya (female, young)</option>
      <option value="hi-IN-MadhurNeural">Hindi — Madhur (male)</option>
      <option value="ur-PK-UzmaNeural">Urdu — Uzma (female)</option>
      <option value="ur-PK-AsadNeural">Urdu — Asad (male)</option>
      <option value="ur-IN-GulNeural">Urdu (India) — Gul (female)</option>
      <option value="en-IN-NeerjaNeural">English (India) — Neerja (female)</option>
    </select>
    <button class="close" style="background:transparent;color:var(--cyan);border:1px solid var(--glass-brd)" onclick="previewVoice()">▶ SUNO (preview)</button>
  </div>
  <button class="close" onclick="saveConfig()">SYNC CORE</button>
  <button class="close" style="background:transparent;color:var(--dim);border:1px solid var(--glass-brd)" onclick="closeModal('cfg')">CLOSE</button>
</div>

<div id="apps" class="modal">
  <h2>APP INVENTORY</h2>
  <input type="text" id="apps-q" placeholder="Search apps…" oninput="filterApps()">
  <div class="scroll" id="apps-list"></div>
  <button class="close" onclick="closeModal('apps')">RETURN</button>
</div>

<div id="contacts" class="modal">
  <h2>CONTACTS</h2>
  <input type="text" id="cts-q" placeholder="Search contacts…" oninput="filterContacts()">
  <div class="scroll" id="cts-list"></div>
  <button class="close" onclick="closeModal('contacts')">RETURN</button>
</div>

<div id="favs" class="modal">
  <h2>⭐ FAVOURITE SONGS</h2>
  <div class="scroll" id="favs-list"></div>
  <button class="close" onclick="closeModal('favs')">RETURN</button>
</div>

<script>
const A = (typeof Android !== "undefined") ? Android : null;
const cfg = { key:"", model:"", nvkey:"", nvregion:"", nvvoice:"" };
const app = document.getElementById('app');
const flow = document.getElementById('flow');
const inp = document.getElementById('inp');
let micOn = false, thinking = false;

window.onload = () => {
  loadConfig();
  particles();
  boot();
  setInterval(diag, 2500);
  inp.addEventListener('keypress', e => { if(e.key==='Enter') manualSend(); });
};

/* ---------- boot ---------- */
function boot(){
  const steps=["INITIALISING CORE","LOADING NEURAL LINK","SYNCING DEVICE","READY"];
  let i=0;
  const t=setInterval(()=>{
    document.getElementById('boot-t').innerText=steps[i++];
    if(i>=steps.length){
      clearInterval(t);
      setTimeout(()=>{
        document.getElementById('boot').style.opacity='0';
        setTimeout(()=>document.getElementById('boot').style.display='none',600);
        app.style.opacity='1';
        diag();
      },350);
    }
  },520);
}

/* ---------- state / orb ---------- */
function setState(s){ // ready | listening | thinking | speaking
  core().className = 'core state-'+s;
  const pill=document.getElementById('pill');
  const label=document.getElementById('corelabel');
  const map={ready:['STANDBY','READY'],listening:['LISTENING','SUN RAHA HOON'],thinking:['THINKING','SOCH RAHA HOON'],speaking:['SPEAKING','BOL RAHA HOON']};
  pill.innerText=map[s][0]; label.innerText=map[s][1];
}
function core(){ return document.getElementById('core'); }

/* ---------- diagnostics ---------- */
function diag(){
  if(!A) return;
  try{
    const c=JSON.parse(A.getSystemContext());
    document.getElementById('s-bat').innerText=c.battery+'%'+(c.charging?' ⚡':'');
    document.getElementById('s-ram').innerText=(''+c.ram).replace(' Available','');
    document.getElementById('s-net').innerText=c.wifi?'WIFI':'CELL';
    document.getElementById('s-core').innerText=c.accessibility==='ACTIVE'?'LINKED':'OFF';
  }catch(e){}
}

/* ---------- config ---------- */
function loadConfig(){
  try{
    const s=localStorage.getItem('jarvis_cfg');
    if(s){ Object.assign(cfg,JSON.parse(s)); document.getElementById('key').value=cfg.key||''; document.getElementById('model').value=cfg.model||''; }
  }catch(e){}
  try{
    document.getElementById('nvkey').value=cfg.nvkey||'';
    document.getElementById('nvregion').value=cfg.nvregion||'';
    if(cfg.nvvoice) document.getElementById('nvvoice').value=cfg.nvvoice;
  }catch(e){}
}
function saveConfig(){
  cfg.key=document.getElementById('key').value.trim();
  cfg.model=document.getElementById('model').value.trim();
  cfg.nvkey=document.getElementById('nvkey').value.trim();
  cfg.nvregion=document.getElementById('nvregion').value.trim();
  cfg.nvvoice=document.getElementById('nvvoice').value;
  localStorage.setItem('jarvis_cfg',JSON.stringify(cfg));
  if(A){ A.setAIConfig(cfg.key, "", cfg.model); A.setNeuralVoice(cfg.nvkey, cfg.nvregion, cfg.nvvoice); }
  closeModal('cfg');
  say(cfg.nvkey?"Core aur nayi awaaz set ho gayi, Sir.":(cfg.key?"Core uplink ho gaya, Sir.":"Sir, settings save kar di."));
}
function previewVoice(){
  const k=document.getElementById('nvkey').value.trim();
  const r=document.getElementById('nvregion').value.trim();
  const v=document.getElementById('nvvoice').value;
  if(A){ A.setNeuralVoice(k,r,v); A.previewNeuralVoice(); }
}
function openModal(id){ document.getElementById(id).style.display='flex'; }
function closeModal(id){ document.getElementById(id).style.display='none'; }

/* ---------- speak ---------- */
function say(t){
  if(!t) return;
  setState('speaking');
  if(A){ A.speak(t); setTimeout(()=>setState(micOn?'listening':'ready'), Math.min(9000, 900+t.length*70)); }
  else { try{ const u=new SpeechSynthesisUtterance(t); u.onend=()=>setState(micOn?'listening':'ready'); speechSynthesis.speak(u);}catch(e){ setState('ready'); } }
}

/* ---------- in-app mic (supplementary; native service is always-on) ---------- */
const SR = window.SpeechRecognition||window.webkitSpeechRecognition;
let rec;
function toggleMic(){ micOn?stopMic():startMic(); }
function startMic(){
  if(!SR){ say("Sir, is view mein mic support nahi hai, lekin main background mein sun raha hoon."); return; }
  if(!rec){
    rec=new SR(); rec.continuous=true; rec.interimResults=false; rec.lang='hi-IN';
    rec.onstart=()=>{ micOn=true; document.getElementById('mic-chip').classList.add('on'); setState('listening'); };
    rec.onresult=e=>{ let f=''; for(let i=e.resultIndex;i<e.results.length;i++) if(e.results[i].isFinal) f+=e.results[i][0].transcript; if(f) handleUserInput(f.trim()); };
    rec.onend=()=>{ if(micOn) try{rec.start();}catch(e){} };
  }
  try{ rec.start(); }catch(e){}
}
function stopMic(){ micOn=false; if(rec) rec.stop(); document.getElementById('mic-chip').classList.remove('on'); setState('ready'); }

/* ---------- input handling ---------- */
function manualSend(){ const v=inp.value.trim(); if(v){ handleUserInput(v); inp.value=''; } }

function addMsg(who,txt){
  const d=document.createElement('div');
  d.className='msg '+(who==='USER'?'u':'j');
  d.innerHTML='<div class="who">'+who+'</div><div>'+escapeHtml(txt)+'</div>';
  flow.appendChild(d); flow.scrollTop=flow.scrollHeight;
}
function escapeHtml(s){ return (''+s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function handleUserInput(t){
  if(!t||thinking) return;
  addMsg('USER',t);
  let cmd=t.toLowerCase().trim();

  // quick device actions (mirror the native fast-parser so the UI feels instant)
  if(/(torch|flashlight|light).*(on|jalao|chalu)/.test(cmd)){ act(()=>A&&A.toggleFlashlight(true),"Ji Sir, torch on kar diya."); return; }
  if(/(torch|flashlight|light).*(off|bujha|band)/.test(cmd)){ act(()=>A&&A.toggleFlashlight(false),"Ji Sir, torch off kar diya."); return; }
  if(cmd==='home'||cmd.includes('home jao')){ act(()=>A&&A.closeCurrent(),"Ji Sir."); return; }
  if(/^(open |kholo |khol )/.test(cmd)){ const p=cmd.replace(/^(open|kholo|khol)\s+/,'').trim(); act(()=>A&&A.openApp(p),"Ji Sir, "+p+" khol raha hoon."); return; }
  if(cmd.includes('screenshot')||cmd==='ss'){ act(()=>A&&A.takeScreenshotAccessibility(),"Ji Sir, screenshot le liya."); return; }

  // favourite song
  if(/(favou?rite|pasandida|fav).*(save|yaad|rakh|note)/.test(cmd)){ act(()=>A&&A.analyzeCurrentScreen(),"Sir, screen se favourite gaana detect karke background service save kar legi. Voice se boliye: yeh mera favourite gaana hai save karo."); return; }
  if(/(favou?rite|pasandida|fav).*(lagao|play|bajao|chalao|sunao)/.test(cmd)){ if(A) A.playFavoriteSong(""); say("Ji Sir, aapka favourite laga raha hoon."); return; }

  // weather (real-time)
  if(cmd.includes('weather')||cmd.includes('mausam')||cmd.includes('mosam')){ addMsg('JARVIS','Mausam check kar raha hoon…'); weather(); return; }

  // youtube
  if(cmd.includes('youtube')){ const q=cmd.replace(/youtube|search|play|baja|lagao|karo|kar|do|khol|video|par|pe|mein/gi,'').trim(); if(q&&A){ A.openYouTubeAndSearch(q); say("Ji Sir, YouTube par "+q+" laga raha hoon."); } return; }

  // whatsapp send: "<name> ko <msg>"
  if((cmd.includes('whatsapp')||cmd.includes('message')||cmd.includes('msg')||cmd.includes('bhej'))&&(cmd.includes(' ko ')||cmd.includes('send'))){
    addMsg('JARVIS','WhatsApp pe bhej raha hoon…'); if(A){ const r=A.sendWhatsApp(cmd,t); if(r) addMsg('JARVIS',r);} return;
  }

  // search / news
  if(cmd.includes('search')||cmd.includes('dhoond')||cmd.includes('google')){ const q=cmd.replace(/search|dhoond|google|khoj|karo|kar|do|par|mein/gi,'').trim(); if(q&&A){ addMsg('JARVIS','Searching…'); A.searchAndSpeak(q);} return; }
  if(cmd.includes('news')||cmd.includes('khabar')||cmd.includes('samachar')){ const topic=cmd.replace(/news|khabar|samachar|aaj|ki|ka|ke/gi,'').trim(); addMsg('JARVIS','News check kar raha hoon…'); if(A) A.searchAndRead(topic?('aaj ki '+topic+' news'):'aaj ki top news'); return; }

  // time / date / battery
  if(cmd==='time'||cmd.includes('time kya')||cmd.includes('kitne baje')){ const x=A?A.getCurrentTime():new Date().toLocaleTimeString(); addMsg('JARVIS','Sir, '+x+' ho rahe hain.'); say('Sir, '+x+' ho rahe hain.'); return; }
  if(cmd==='date'||cmd.includes('tarikh')||cmd.includes('date kya')){ const x=A?A.getCurrentDate():new Date().toLocaleDateString(); addMsg('JARVIS','Sir, aaj '+x+' hai.'); say('Sir, aaj '+x+' hai.'); return; }
  if(cmd.includes('battery')||cmd.includes('charge')){ if(A){ const b=JSON.parse(A.getBatteryInfo()); const m='Sir, battery '+b.level+'% hai. '+(b.charging?'Charging ho rahi hai.':'Charging nahi ho rahi.'); addMsg('JARVIS',m); say(m);} return; }

  // screen read
  if(cmd.includes('screen')&&(cmd.includes('kya')||cmd.includes('padho')||cmd.includes('read')||cmd.includes('batao')||cmd.includes('scan'))){ addMsg('JARVIS','Screen scan kar raha hoon…'); if(A){ const info=A.analyzeCurrentScreen(); addMsg('JARVIS',info);} return; }

  // AI fallback
  if(!cfg.key){ addMsg('JARVIS','Sir, pehle settings mein API key set kijiye.'); say('Sir, pehle API key set kijiye.'); return; }
  thinking=true; setState('thinking');
  try{
    const reply=A?A.askAI(t):"Sir, bridge available nahi hai.";
    addMsg('JARVIS',reply); say(reply);
  }catch(e){ addMsg('JARVIS','Signal failure, Sir.'); say('Signal failure, Sir.'); }
  thinking=false;
}
function act(fn,msg){ try{fn();}catch(e){} addMsg('JARVIS',msg); say(msg); }

/* ---------- real-time weather (wttr.in) ---------- */
async function weather(){
  try{
    const r=await fetch('https://wttr.in/?format=3',{headers:{'User-Agent':'curl'}});
    const txt=(await r.text()).trim();
    const m='Sir, abhi ka mausam: '+txt+'.';
    addMsg('JARVIS',m); say(m);
  }catch(e){
    if(A){ A.searchAndRead('aaj ka mausam temperature'); }
    else { addMsg('JARVIS','Sir, mausam abhi load nahi ho paaya.'); }
  }
}

/* ---------- apps ---------- */
let appsCache=[];
function showApps(){
  if(!A) return; openModal('apps');
  const box=document.getElementById('apps-list'); box.innerHTML='<p style="text-align:center;color:var(--dim);padding:20px">SCANNING…</p>';
  setTimeout(()=>{ try{ appsCache=(JSON.parse(A.getSystemContext()).apps||[]).sort(); renderApps(appsCache);}catch(e){ box.innerHTML='<p style="color:var(--red);text-align:center">Error</p>'; } },200);
}
function renderApps(list){
  const box=document.getElementById('apps-list'); box.innerHTML='';
  list.forEach(a=>{ const d=document.createElement('div'); d.className='row'; d.innerHTML='<div class="nm">'+escapeHtml(a)+'</div><button class="mini wa" onclick="launch(\''+a.replace(/'/g,"\\'")+'\')">LAUNCH</button>'; box.appendChild(d); });
}
function filterApps(){ const q=document.getElementById('apps-q').value.toLowerCase(); renderApps(appsCache.filter(a=>a.toLowerCase().includes(q))); }
function launch(n){ if(A) A.openApp(n); closeModal('apps'); }

/* ---------- contacts ---------- */
let phoneC=[], savedC=[];
function showContacts(){
  if(!A) return; openModal('contacts');
  const box=document.getElementById('cts-list'); box.innerHTML='<p style="text-align:center;color:var(--dim);padding:20px">LOADING…</p>';
  try{ phoneC=JSON.parse(A.getAllPhoneContacts()); savedC=JSON.parse(A.getSavedContacts()); renderContacts(phoneC,savedC); }
  catch(e){ box.innerHTML='<p style="color:var(--red);text-align:center">Error loading contacts</p>'; }
}
function renderContacts(phone,saved){
  const box=document.getElementById('cts-list'); box.innerHTML='';
  const mk=(c,isSaved)=>{ const d=document.createElement('div'); d.className='row';
    const nm=escapeHtml(c.name), nb=escapeHtml(c.number);
    d.innerHTML='<div><div class="nm">'+nm+(isSaved?' ⭐':'')+'</div><div class="nb">'+nb+'</div></div>'+
      '<div style="display:flex;gap:5px;flex-wrap:wrap">'+
      '<button class="mini wa" onclick="waChat(\''+nb+'\')">WA</button>'+
      '<button class="mini call" onclick="callN(\''+nb+'\')">CALL</button>'+
      (isSaved?'<button class="mini del" onclick="delC(\''+nm.replace(/'/g,"\\'")+'\')">DEL</button>':'')+'</div>';
    return d; };
  if(saved&&saved.length){ const h=document.createElement('div'); h.style.cssText='color:var(--amber);font-size:10px;letter-spacing:2px;padding:8px 2px'; h.innerText='⭐ SAVED'; box.appendChild(h); saved.forEach(c=>box.appendChild(mk(c,true))); }
  if(phone&&phone.length){ const h=document.createElement('div'); h.style.cssText='color:var(--cyan);font-size:10px;letter-spacing:2px;padding:8px 2px'; h.innerText='📞 PHONE'; box.appendChild(h);
    const set=new Set((saved||[]).map(c=>c.name.toLowerCase())); phone.forEach(c=>{ if(!set.has(c.name.toLowerCase())) box.appendChild(mk(c,false)); }); }
  if(!box.children.length) box.innerHTML='<p style="text-align:center;color:var(--dim)">No contacts</p>';
}
function filterContacts(){ const q=document.getElementById('cts-q').value.toLowerCase();
  if(!q){ renderContacts(phoneC,savedC); return; }
  renderContacts(phoneC.filter(c=>c.name.toLowerCase().includes(q)||c.number.includes(q)), savedC.filter(c=>c.name.toLowerCase().includes(q)||c.number.includes(q))); }
function waChat(n){ if(A) A.openWhatsAppChat(n); closeModal('contacts'); say("Ji Sir, WhatsApp khol raha hoon."); }
function callN(n){ if(A) A.makeCall(n); closeModal('contacts'); say("Ji Sir, call kar raha hoon."); }
function delC(n){ if(A){ A.saveContact("__delete__"+n,""); showContacts(); say("Sir, "+n+" delete kar diya."); } }

/* ---------- favourites ---------- */
function showFavs(){
  openModal('favs');
  const box=document.getElementById('favs-list'); box.innerHTML='';
  let list=[]; try{ list=A?JSON.parse(A.getFavoriteSongs()):[]; }catch(e){}
  if(!list.length){ box.innerHTML='<p style="text-align:center;color:var(--dim);padding:20px">Abhi koi favourite nahi.<br>Gaana chalu karke boliye:<br>“yeh mera favourite gaana hai, save karo”.</p>'; return; }
  list.slice().reverse().forEach(s=>{ const d=document.createElement('div'); d.className='row';
    d.innerHTML='<div class="nm">'+escapeHtml(s)+'</div><button class="mini wa" onclick="playFav(\''+s.replace(/'/g,"\\'")+'\')">PLAY</button>'; box.appendChild(d); });
}
function playFav(s){ if(A) A.playFavoriteSong(s); closeModal('favs'); say("Ji Sir, "+s+" laga raha hoon."); }

/* ---------- particles ---------- */
function particles(){
  const c=document.getElementById('fx'), x=c.getContext('2d');
  c.width=innerWidth; c.height=innerHeight;
  const p=[]; for(let i=0;i<28;i++) p.push({x:Math.random()*c.width,y:Math.random()*c.height,dx:(Math.random()-.5)*.4,dy:(Math.random()-.5)*.4});
  (function d(){ x.clearRect(0,0,c.width,c.height); x.fillStyle='rgba(0,229,255,.5)';
    for(const q of p){ q.x+=q.dx; q.y+=q.dy; if(q.x<0||q.x>c.width)q.dx*=-1; if(q.y<0||q.y>c.height)q.dy*=-1; x.beginPath(); x.arc(q.x,q.y,1.4,0,7); x.fill(); }
    for(let i=0;i<p.length;i++) for(let j=i+1;j<p.length;j++){ const a=p[i],b=p[j],dist=Math.hypot(a.x-b.x,a.y-b.y); if(dist<110){ x.strokeStyle='rgba(0,229,255,'+(.12*(1-dist/110))+')'; x.beginPath(); x.moveTo(a.x,a.y); x.lineTo(b.x,b.y); x.stroke(); } }
    requestAnimationFrame(d); })();
}
